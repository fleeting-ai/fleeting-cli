# Empty cmd: launches the harness (omp --profile <name>, claude, or codex)
operator: richard
grid: 3

bus:
  url: amqp://guest:guest@127.0.0.1:5672/
  db: sqlite://~/.fleeting/bus.db

teams:
  - id: core
    members: [risa, hiro, nova, bolt, kite, veil]
  - id: review
    members: [hiro, veil]

fleets:
  - id: local-core
    goal: land the first fleeting slice
    agents:
      - name: nova
        role: worker
        lane: ux
        harness: omp
        rank: 10
        peers: [risa]
      - name: bolt
        role: worker
        lane: infra
        harness: omp
        peers: [risa]
      - name: kite
        role: worker
        lane: module
        harness: omp
        peers: [risa]
      - name: veil
        role: worker
        lane: security
        harness: omp
        peers: [hiro, risa]
      - name: hiro
        role: judge
        lane: review
        harness: omp
        hub: true
        peers: [risa, nova, bolt, kite, veil]
      - name: risa
        role: foreman
        lane: pace
        harness: omp
        hub: true
        rank: 50
        peers: [hiro, nova, bolt, kite, veil]
